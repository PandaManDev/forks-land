<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Forks Land — 404</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
display:grid;
place-items:center;
font-family:system-ui,sans-serif;
background:#08060d;
color:#fff;
text-align:center;
}

.box{
width:min(500px,calc(100% - 30px));
padding:40px;
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
background:#100c18;
box-shadow:0 30px 100px rgba(0,0,0,.5);
}

.logo{
width:90px;
height:90px;
object-fit:cover;
border-radius:25px;
margin-bottom:20px;
}

h1{
font-size:80px;
margin:0;
background:linear-gradient(90deg,#8b5cf6,#c084fc);
-webkit-background-clip:text;
color:transparent;
}

p{
color:#a7a0b5;
}

a{
display:inline-block;
margin-top:20px;
padding:12px 18px;
border-radius:12px;
background:#8b5cf6;
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<img
class="logo"
src="/assets/logo.webp"
alt="Forks Land">

<h1>404</h1>

<h2>Page not found</h2>

<p>
Looks like you wandered into a channel
that doesn't exist.
</p>

<a href="/">
Return to Forks Land
</a>

</div>

</body>
</html>
