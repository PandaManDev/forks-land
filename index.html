<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forks Land | Discord Community</title>
  <meta name="description" content="Forks Land — a Discord community for gaming, friends, voice chats, events, and good vibes.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at 50% 20%, rgba(117, 45, 255, .18), transparent 35%),
        radial-gradient(circle at 15% 60%, rgba(0, 120, 255, .12), transparent 30%),
        #030313;
      color: #fff;
      overflow-x: hidden;
    }

    /* =========================
       BACKGROUND
    ========================= */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      background:
        radial-gradient(circle at 20% 20%, rgba(125, 45, 255, .12), transparent 22%),
        radial-gradient(circle at 80% 35%, rgba(0, 160, 255, .10), transparent 25%),
        radial-gradient(circle at 50% 90%, rgba(140, 30, 255, .12), transparent 30%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: .25;
      background-image:
        radial-gradient(circle, #fff 1px, transparent 1px);
      background-size: 120px 120px;
      animation: stars 20s linear infinite;
    }

    @keyframes stars {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-120px);
      }
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 92px;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 5%;

      background: rgba(3, 3, 19, .78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-bottom: 1px solid rgba(122, 61, 255, .35);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;

      color: #fff;
      text-decoration: none;

      font-size: 27px;
      font-weight: 800;
      font-style: italic;

      text-shadow:
        0 0 10px #8f45ff,
        0 0 25px #7b36ff;
    }

    .brand-icon {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      font-size: 38px;
      color: #fff;

      text-shadow:
        0 0 8px #fff,
        0 0 20px #7d45ff,
        0 0 40px #7d45ff;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 42px;
    }

    nav a {
      position: relative;

      color: #c9c8dd;
      text-decoration: none;

      font-size: 15px;
      font-weight: 500;

      transition: .25s ease;
    }

    nav a:hover,
    nav a.active {
      color: #fff;
      text-shadow: 0 0 12px #9d57ff;
    }

    nav a.active::after {
      content: "";
      position: absolute;

      left: 0;
      right: 0;
      bottom: -15px;

      height: 3px;

      border-radius: 10px;

      background: linear-gradient(
        90deg,
        #8c35ff,
        #bc5cff
      );

      box-shadow: 0 0 12px #9d43ff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .theme-toggle {
      width: 88px;
      height: 42px;

      border-radius: 30px;

      border: 1px solid rgba(133, 140, 210, .55);

      background: rgba(15, 16, 40, .7);

      display: flex;
      align-items: center;
      justify-content: space-around;

      color: white;

      cursor: pointer;
      font-size: 19px;
    }

    .discord-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;

      padding: 15px 27px;

      border-radius: 30px;

      border: none;

      background: linear-gradient(
        135deg,
        #6941ff,
        #8d48ff
      );

      color: #fff;

      font-weight: 700;
      text-decoration: none;

      box-shadow:
        0 0 15px rgba(126, 65, 255, .45),
        inset 0 1px rgba(255,255,255,.25);

      transition: .25s ease;
    }

    .discord-btn:hover {
      transform: translateY(-2px) scale(1.02);

      box-shadow:
        0 0 25px rgba(141, 70, 255, .75),
        0 0 50px rgba(100, 40, 255, .3);
    }

    .discord-icon {
      font-size: 21px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 810px;

      padding: 150px 20px 70px;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(117, 45, 255, .26),
          transparent 28%
        ),
        radial-gradient(
          circle at 15% 45%,
          rgba(0, 90, 255, .16),
          transparent 25%
        ),
        radial-gradient(
          circle at 85% 45%,
          rgba(120, 20, 255, .15),
          transparent 25%
        );
    }

    .hero::before {
      content: "";

      position: absolute;
      width: 650px;
      height: 650px;

      top: 70px;
      left: 50%;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(80, 25, 180, .28),
          transparent 65%
        );

      filter: blur(20px);
    }

    .hero-content {
      position: relative;
      z-index: 2;

      width: min(900px, 100%);

      text-align: center;
    }

    .fork-symbol {
      width: 150px;
      height: 150px;

      margin: 0 auto 15px;

      display: grid;
      place-items: center;

      font-size: 125px;
      line-height: 1;

      color: white;

      text-shadow:
        0 0 5px white,
        0 0 15px #8f4dff,
        0 0 35px #8f4dff,
        0 0 70px #541aff;

      animation: floating 4s ease-in-out infinite;
    }

    @keyframes floating {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }
    }

    .hero-title {
      font-size: clamp(60px, 9vw, 118px);
      line-height: .9;

      font-weight: 900;
      font-style: italic;
      letter-spacing: -5px;

      background: linear-gradient(
        100deg,
        #d85bff,
        #9f48ff 38%,
        #54d9ff 75%,
        #9aeaff
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      filter:
        drop-shadow(0 0 8px rgba(187, 73, 255, .9))
        drop-shadow(0 0 22px rgba(85, 99, 255, .5));

      margin-bottom: 30px;
    }

    .hero-tags {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;

      gap: 18px;

      margin-bottom: 25px;

      color: #d58cff;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: .8px;
    }

    .hero-tags span:nth-child(3n) {
      color: #63dfff;
    }

    .dot {
      color: #a855f7 !important;
    }

    .hero-description {
      max-width: 700px;

      margin: 0 auto 30px;

      color: #e2e1ed;

      font-size: 17px;
      line-height: 1.7;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 18px;

      margin-bottom: 28px;
    }

    .hero-buttons .discord-btn {
      min-width: 260px;
      padding: 17px 28px;
    }

    .learn-btn {
      min-width: 170px;

      padding: 16px 28px;

      border-radius: 20px;

      border: 1px solid rgba(157, 126, 255, .8);

      color: #fff;
      background: rgba(10, 12, 35, .55);

      text-decoration: none;

      font-weight: 600;

      transition: .25s ease;
    }

    .learn-btn:hover {
      background: rgba(100, 50, 200, .2);

      box-shadow:
        0 0 20px rgba(130, 70, 255, .3);

      transform: translateY(-2px);
    }

    .online {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;

      color: #d9d8e8;
      font-size: 14px;
    }

    .online-dot {
      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: #00ed91;

      box-shadow:
        0 0 8px #00ed91,
        0 0 15px rgba(0, 237, 145, .6);

      animation: pulse 1.7s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.35);
        opacity: .65;
      }
    }

    /* =========================
       FEATURES
    ========================= */

    .features-section {
      position: relative;

      max-width: 1220px;

      margin: -15px auto 0;

      padding: 20px 20px 45px;

      z-index: 5;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;

      padding: 20px;

      border: 1px solid rgba(105, 53, 255, .45);

      border-radius: 15px;

      background: rgba(5, 5, 25, .58);

      box-shadow:
        0 0 35px rgba(79, 35, 200, .10);

      backdrop-filter: blur(15px);
    }

    .feature-card {
      min-height: 215px;

      padding: 25px 18px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(13, 17, 44, .88),
          rgba(5, 7, 26, .75)
        );

      border: 1px solid rgba(92, 116, 255, .35);

      transition: .3s ease;
    }

    .feature-card:hover {
      transform: translateY(-7px);

      border-color: #994fff;

      box-shadow:
        0 0 25px rgba(129, 57, 255, .22);
    }

    .feature-icon {
      height: 60px;

      display: flex;
      align-items: center;

      font-size: 42px;

      margin-bottom: 12px;

      color: #b652ff;

      text-shadow:
        0 0 10px currentColor,
        0 0 25px currentColor;
    }

    .feature-card:nth-child(2) .feature-icon,
    .feature-card:nth-child(4) .feature-icon {
      color: #20d9ff;
    }

    .feature-card h3 {
      margin-bottom: 12px;

      font-size: 18px;
      font-weight: 700;
    }

    .feature-card p {
      color: #c2c2d8;

      font-size: 14px;
      line-height: 1.55;
    }

    .feature-line {
      width: 40px;
      height: 4px;

      margin-top: auto;
      padding-top: 0;

      border-radius: 20px;

      background: #bb50ff;

      box-shadow: 0 0 12px #bb50ff;
    }

    .feature-card:nth-child(2) .feature-line,
    .feature-card:nth-child(4) .feature-line {
      background: #16d9ff;
      box-shadow: 0 0 12px #16d9ff;
    }

    /* =========================
       ABOUT
    ========================= */

    section.content-section {
      max-width: 1050px;
      margin: 80px auto;
      padding: 20px;
      text-align: center;
    }

    .section-title {
      font-size: 42px;
      margin-bottom: 15px;

      background: linear-gradient(
        90deg,
        #c64cff,
        #5edfff
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .section-text {
      color: #bcbcd0;
      line-height: 1.8;
      font-size: 16px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      max-width: 900px;

      margin: 30px auto 0;

      padding: 35px 20px 45px;

      text-align: center;
    }

    .footer-line {
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        #5d34ad,
        transparent
      );

      margin-bottom: 25px;
    }

    .footer-brand {
      color: #8d56ff;

      font-size: 28px;

      text-shadow:
        0 0 12px #743bff;
    }

    .footer-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 17px;

      margin: 15px 0;

      color: #9f9ebc;

      font-size: 13px;
